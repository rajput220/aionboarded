name: Weekly Newsletter Pipeline

# ── Schedule: Every Sunday at 6:00 AM EDT (10:00 UTC) ──
on:
  schedule:
    - cron: '0 10 * * 0'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview email only, no subscriber blast)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      skip_email:
        description: 'Skip email dispatch entirely'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      week_number:
        description: 'Force specific week number (leave empty for auto-detect)'
        required: false
        default: ''
      subject_override:
        description: 'Override email subject line (e.g. "Part 2: Updated Week 19 Newsletter")'
        required: false
        default: ''

jobs:
  publish:
    name: Build & Publish Weekly Newsletter
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # Required to push newsletter HTML back to repo
      issues: write     # Required to create failure notification issues

    steps:
      # ── 1. Checkout ───────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      # ── 2. Node.js + pnpm ─────────────────────────────────
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pipeline dependencies
        run: pnpm add googleapis mammoth @anthropic-ai/sdk --save-dev

      # ── 3. Write Google Service Account key ───────────────
      - name: Write Google Service Account key
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > google-service-account.json

      # ── 4. Run pipeline: fetch + generate + build HTML ────
      - name: Run content generation pipeline
        env:
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./google-service-account.json
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          AGENT_TEST_EMAIL: ${{ secrets.AGENT_TEST_EMAIL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          mkdir -p tmp-pipeline

          ARGS="--skip-email --skip-ingest"

          if [ -n "${{ github.event.inputs.week_number }}" ]; then
            ARGS="$ARGS --week ${{ github.event.inputs.week_number }}"
          fi

          # Run pipeline: Drive fetch → Claude generate → build HTML only
          node scripts/pipeline/run-weekly-pipeline.mjs $ARGS

      # ── 5. Commit & push newsletter HTML + updated archive page ────
      - name: Commit generated newsletter files
        run: |
          git config --local user.email "pipeline@aionboarded.ai"
          git config --local user.name "AI Onboarded Pipeline"
          git add public/newsletter/ src/app/\(frontend\)/newsletter/page.tsx
          git diff --staged --quiet || git commit -m "feat: auto-publish weekly newsletter [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main

      # ── 6. SSH Deploy to production server ────────────────
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 20m
          script: |
            set -e
            echo "=== Deploying AI Onboarded ==="
            cd ${{ secrets.SERVER_PATH }}
            git pull origin main
            # Run Docker build in background so SSH session doesn't time out
            nohup bash -c "
              docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build app &&
              docker compose -f docker-compose.prod.yml restart nginx &&
              echo '[DEPLOY] Build complete' >> /tmp/aio-deploy.log
            " >> /tmp/aio-deploy.log 2>&1 &
            echo "Deploy started in background (PID: $!)"
            echo "=== SSH session complete — deploy running ===" 

      # ── 7. Wait for server to be ready ────────────────────
      - name: Wait for server to be healthy
        run: |
          echo "Waiting 3 minutes for Docker build to complete..."
          sleep 180
          # Poll until the site responds (up to 20 attempts × 30s = 10 more minutes)
          for i in {1..20}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.NEXT_PUBLIC_SITE_URL }}" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
              echo "✅ Server is up and healthy!"
              break
            fi
            if [ $i -eq 20 ]; then
              echo "⚠️ Server did not respond in time — continuing anyway (deploy may still be running)"
            fi
            sleep 30
          done

      # ── 8. Ingest news items into Payload CMS ─────────────
      - name: Ingest news items into Payload CMS
        if: github.event.inputs.dry_run != 'true'
        run: |
          WEEK=$(node -e "
            const d = require('fs').readdirSync('tmp-pipeline').find(f => f.includes('content.json') || f.includes('dry-run.json'));
            if (!d) { console.log(15); process.exit(0); }
            const c = JSON.parse(require('fs').readFileSync('tmp-pipeline/' + d, 'utf8'));
            console.log(c.weekNumber);
          ")

          NEWS_ITEMS=$(node -e "
            const d = require('fs').readdirSync('tmp-pipeline').find(f => f.includes('content.json') || f.includes('dry-run.json'));
            const c = JSON.parse(require('fs').readFileSync('tmp-pipeline/' + d, 'utf8'));
            console.log(JSON.stringify(c.newsItems));
          ")

          echo "Ingesting news for Week $WEEK..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.NEXT_PUBLIC_SITE_URL }}/api/agent/ingest-news" \
            -H "Content-Type: application/json" \
            -d "{\"apiKey\":\"${{ secrets.AGENT_API_KEY }}\",\"weekNumber\":$WEEK,\"newsItems\":$NEWS_ITEMS}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)

          echo "Response ($HTTP_CODE): $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "⚠️ Ingest returned HTTP $HTTP_CODE — continuing anyway"
          else
            echo "✅ News items ingested successfully"
          fi

      # ── 9. Archive old articles ───────────────────────────
      - name: Archive old news articles
        if: github.event.inputs.dry_run != 'true'
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.NEXT_PUBLIC_SITE_URL }}/api/agent/archive-news" \
            -H "Content-Type: application/json" \
            -d "{\"apiKey\":\"${{ secrets.AGENT_API_KEY }}\",\"keepWeeks\":4}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "Archive response ($HTTP_CODE): $BODY"

      # ── 10. Send newsletter email ─────────────────────────
      - name: Send newsletter email to subscribers
        env:
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AGENT_TEST_EMAIL: ${{ secrets.AGENT_TEST_EMAIL }}
        run: |
          CONTENT_FILE=$(ls tmp-pipeline/*.json | head -1)
          WEEK=$(node -e "const c=JSON.parse(require('fs').readFileSync('$CONTENT_FILE','utf8')); console.log(c.weekNumber)")
          THEME=$(node -e "const c=JSON.parse(require('fs').readFileSync('$CONTENT_FILE','utf8')); console.log(c.weekTheme)")
          SUBJECT=$(node -e "const c=JSON.parse(require('fs').readFileSync('$CONTENT_FILE','utf8')); console.log(c.emailSubject)")
          HTML=$(node -e "const c=JSON.parse(require('fs').readFileSync('$CONTENT_FILE','utf8')); process.stdout.write(c.newsletterHtml)")

          DRY_RUN="false"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN="true"
            echo "DRY RUN — sending preview only to ${{ secrets.AGENT_TEST_EMAIL }}"
          fi

          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('$CONTENT_FILE', 'utf8'));
            
            // Use the Claude-generated email-safe HTML (inline styles, absolute links)
            // NOT the webpage HTML which has broken anchor (#) links in email clients
            const htmlBody = c.newsletterHtml;
            
            fetch('${{ secrets.NEXT_PUBLIC_SITE_URL }}/api/agent/dispatch-newsletter', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                apiKey: process.env.AGENT_API_KEY,
                weekNumber: c.weekNumber,
                theme: c.weekTheme,
                subject: '${{ github.event.inputs.subject_override }}' || c.emailSubject,
                htmlBody: htmlBody,
                dryRun: '$DRY_RUN' === 'true'
              })
            })
            .then(res => res.json())
            .then(data => {
              if (data.success) {
                console.log('✅ Campaign dispatched — Sent: ' + data.sent + ', Failed: ' + data.failed);
              } else {
                console.error('❌ Failed:', data);
                process.exit(1);
              }
            })
            .catch(err => {
              console.error('❌ Request error:', err);
              process.exit(1);
            });
          "

      # ── 11. Upload pipeline artifacts ─────────────────────
      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_id }}
          path: tmp-pipeline/
          retention-days: 30

      # ── 12. Notify on failure ─────────────────────────────
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Weekly Pipeline Failed — ${new Date().toDateString()}`,
              body: `Pipeline failed on run [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).\n\nCheck the pipeline log artifact for details.`,
              labels: ['pipeline-failure']
            })
