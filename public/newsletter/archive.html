<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsletter Archive | AI Onboarded</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
    body { font-family: 'Inter', sans-serif; background: #F8FAFC; color: #0F172A; text-align: center; padding: 100px 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    h1 { font-weight: 800; font-size: 32px; margin-bottom: 20px; }
    h1 span { color: #0A84FF; }
    p { color: #64748B; font-size: 18px; margin-bottom: 40px; }
    .archive-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
    .archive-card { border: 1px solid #E2E8F0; padding: 24px; border-radius: 12px; text-decoration: none; color: inherit; transition: all 0.2s; display: flex; flex-direction: column; align-items: flex-start; }
    .archive-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(10,132,255,0.15); border-color: #0A84FF; }
    .badge { background: #E0F2FE; color: #0284C7; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-bottom: 12px; }
    .title { font-weight: 600; font-size: 18px; text-align: left; margin-bottom: 8px; }
    .date { color: #64748B; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI <span>Onboarded</span> Newsletters</h1>
    <p>Explore our weekly insights on the rapidly evolving Agentic Era.</p>
    
    <div class="archive-grid">
      <a href="week-7.html" class="archive-card">
        <span class="badge">Week 7</span>
        <div class="title">Scaling Action in the Agentic Era</div>
        <div class="date">March 10, 2026</div>
      </a>
    </div>
  </div>
</body>
</html>
